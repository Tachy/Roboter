[tool.poetry]
name = "unkrautroboter-bilderkennung"
version = "0.1.0"
description = "Bilderkennungssystem für einen Unkrautroboter"
authors = ["Johannes Güntert <johannes@gutshof-guentert.de>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
picamera2 = "*"          # Systempaket auf dem Pi (apt), kein PyPI-Pin sinnvoll
pillow = ">=10.0"
pyserial = ">=3.5"
ultralytics = ">=8.4,<8.5"   # YOLO26-fähig; NCNN-Inferenz auf ARM64 gefixt (>= 8.4.x)
ncnn = "*"               # NCNN-Runtime (YOLO_RUNTIME="ncnn"); aarch64-Wheel auf dem Pi
numpy = ">=1.24"         # direkt genutzt (geometry, yolo_detector, camera)
websockets = ">=11.0"    # status_ws_server – vorher nicht deklariert

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

