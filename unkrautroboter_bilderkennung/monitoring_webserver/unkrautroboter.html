<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJPEG Stream</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="main-layout">
        <div id="mode-selector">
            <h2>Harry Botter live</h2>
            <select id="mode" onchange="changeMode()">
                <option value="AUTO">AUTO</option>
                <option value="MANUAL">MANUAL</option>
                <option value="DISTORTION">DISTORTION</option>
                <option value="EXTRINSIK">EXTRINSIK</option>
            </select>

            <div id="status-box" class="panel">
                <b>Status:</b><br>
                <span id="status-content">Warte auf Statusdaten ...</span>
            </div>

            <div id="arduino-box" class="panel">
                <b>Arduino:</b><br>
                <span id="arduino-content">–</span>
            </div>

            <div id="last-capture-box" class="panel">
                <div class="panel-title">Letzte Aufnahme</div>
                <img id="last-capture-img" src="" alt="Letzte Aufnahme" />
                <div id="last-capture-time">Letzte Aufnahme: –</div>
                <div id="last-capture-empty">Noch keine Aufnahme</div>
            </div>
            <div id="reset-box" class="panel">
                <div class="panel-title">Dienst</div>
                <button id="reset-btn" type="button" class="wide">Reset</button>
            </div>
            <div id="training-box" class="panel">
                <div class="panel-title">Training</div>
                <div id="training-status" class="idle">–</div>
                <div id="training-meta">–</div>
                <button id="training-btn" type="button" class="wide">Trainieren &amp; deployen</button>
                <label class="training-skip"><input type="checkbox" id="training-skip"> skip export</label>
                <label class="training-skip"><input type="checkbox" id="training-base"> Basis: YOLO26s (Erstumstieg)</label>
                <pre id="training-log"></pre>
            </div>
        </div>
        <div id="video-container">
            <div class="stream-wrapper">
                <img id="stream-img" src="" alt="MJPEG Stream">
                <div id="stream-placeholder">Stream nicht verfügbar</div>
                <div id="joyui">
                    <div id="joypad">
                        <div class="stick"></div>
                    </div>
                    <button id="joybtn" type="button" class="wide">Bild aufnehmen</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/config.js" defer></script>
    <script src="js/mode.js" defer></script>
    <script src="js/stream.js" defer></script>
    <script src="js/status.js" defer></script>
    <script src="js/ws.js" defer></script>
    <script src="js/heartbeat.js" defer></script>
    <script src="js/joypad.js" defer></script>
    <script src="js/reset.js" defer></script>
    <script src="js/training.js" defer></script>
</body>

</html>
