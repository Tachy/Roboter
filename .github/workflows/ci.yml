name: CI

on:
  push:
  pull_request:

jobs:
  bilderkennung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unkrautroboter_bilderkennung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # opencv-python-headless: geometry/calibration nutzen cv2 (ChArUco,
        # solvePnP, Homographie). pyserial/picamera2 sind Pi-only – die Tests
        # dafür überspringen sich selbst (importorskip / conftest-Stub).
        run: pip install numpy pytest opencv-python-headless
      - name: Syntax check (compileall)
        run: python -m compileall -q src main.py
      - name: Run unit tests
        run: pytest -q
